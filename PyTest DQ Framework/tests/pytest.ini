[pytest]
markers =
    parquet_data: tests validating parquet outputs
    postgres_data: tests that run against the Postgres source
    facility_name_min_time_spent_per_visit_date: checks for this dataset
    facility_type_avg_time_spent_per_visit_date: checks for facility type avg time spent dataset
    patient_sum_treatment_cost_per_facility_type: checks for patient treatment cost dataset
    uniqueness: tests validating uniqueness / duplicates
    completeness: tests validating data completeness
    validity_check: tests validating data validity
    consistency_check: tests validating data consistency
    smoke: smoke tests for basic functionality
python_files = test_*.py

# Suppress warnings
filterwarnings =
    ignore:.*pandas only supports SQLAlchemy.*:UserWarning
    ignore:.*isnull is deprecated.*:FutureWarning