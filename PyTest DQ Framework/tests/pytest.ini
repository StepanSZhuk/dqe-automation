[pytest]
markers =
    parquet_data: tests validating parquet outputs
    facility_name_min_time_spent_per_visit_date: checks for this dataset
    facility_type_avg_time_spent_per_visit_date: checks for facility type avg time spent dataset
    patient_sum_treatment_cost_per_facility_type: checks for patient treatment cost dataset
    example: sample or tutorial tests
    smoke: smoke tests for basic functionality
    completeness: tests checking data completeness between source and target
    postgres_data: tests for postgres database tables
    postgres_patients: tests for patients table

# python_files
python_files = test_*.py